# 项目级 ruff 配置
#
# 本插件的其余规则保持默认严格(未使用导入、类型注解现代化、导入排序、格式等)。
#
# 以下三组规则按项目策略关闭(有意的鲁棒性设计,不应视为缺陷):
#   - BLE001 (盲捕获 Exception):插件运行在不可控环境 —— 网络图片获取、PIL 解码头像、
#     字体文件扫描、补丁第三方库(pillowmd/astrbot)内部、事件对象属性访问等,异常面
#     不可穷举。广泛 `except Exception` + 日志/回退是刻意为之:任何一处崩溃都会让
#     聊天机器人整条消息挂掉。
#   - S110 / S112 (try-except-pass / continue):字体候选回退、临时文件清理、"尽力而为"
#     补丁等路径,静默跳过并继续是正确行为,打日志只会刷屏。
[lint]
ignore = ["BLE001", "S110", "S112"]